<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Responsive layout inspection</title><style>body{background:#eee;font:14px sans-serif}section{margin:20px 0}iframe{height:1050px;border:1px solid #aaa;display:block}h2{margin:20px 0 8px}</style></head><body><h1>Responsive inspection</h1><p>Development-only layout harness. Each frame has an exact viewport width.</p><main id="frames"></main><script>
const target=new URLSearchParams(location.search).get('target')||'admin/dashboard';
const allowed=['admin/dashboard','admin/create-delivery','admin/reports','admin/customers','admin/receipts','delivery/dashboard','delivery/delivery-details','auth/login','auth/select-role'];
if(allowed.includes(target)){document.querySelector('#frames').innerHTML=[1440,1024,768,390,320].map(width=>`<section><h2>${target} · ${width}px</h2><iframe title="${width}px preview" width="${width}" src="../pages/${target}.html"></iframe><output>Loading…</output></section>`).join('');}
document.querySelectorAll('iframe').forEach(frame=>frame.addEventListener('load',()=>{const doc=frame.contentDocument;const w=Number(frame.width);const stats={width:w,scrollWidth:doc.documentElement.scrollWidth,ready:!!doc.querySelector('h1'),overflow:doc.documentElement.scrollWidth>w,theme:doc.documentElement.dataset.theme};frame.nextElementSibling.textContent=JSON.stringify(stats);frame.dataset.result=JSON.stringify(stats);}));
</script></body></html>
