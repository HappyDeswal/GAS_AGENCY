<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Receipt print stylesheet inspection</title></head><body><h1>Print stylesheet inspection</h1><p>This simulates the project’s print stylesheet. It does not open a printer or generate a PDF.</p><output id="result">Loading…</output><iframe title="Receipt with print styling" src="../pages/admin/receipts.html?id=DEL-1001" width="794" height="1000"></iframe><script>const frame=document.querySelector('iframe');frame.addEventListener('load',()=>{const doc=frame.contentDocument;const printRules=[...doc.styleSheets].flatMap(sheet=>[...sheet.cssRules]).filter(rule=>rule.conditionText==='print').map(rule=>[...rule.cssRules].map(r=>r.cssText).join('\n')).join('\n');const style=doc.createElement('style');style.textContent=printRules;doc.head.append(style);const css=frame.contentWindow.getComputedStyle;document.querySelector('#result').textContent=JSON.stringify({navigationHidden:css(doc.querySelector('.sidebar')).display==='none',headerHidden:css(doc.querySelector('.topbar')).display==='none',pageHeadingHidden:css(doc.querySelector('.page-heading')).display==='none',receiptBackground:css(doc.querySelector('.receipt')).backgroundColor,receiptVisible:css(doc.querySelector('.receipt')).display!=='none',pageBackground:css(doc.body).backgroundColor});});</script></body></html>
