<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Offline chart fallback check</title><link rel="stylesheet" href="../assets/css/base.css"><link rel="stylesheet" href="../assets/css/components.css"></head><body><main style="max-width:800px;padding:30px"><h1>Chart fallback check</h1><p>This test intentionally does not load Chart.js.</p><div id="chart"></div><output id="result"></output></main><script type="module">import {chartPanel,initializeCharts} from '../assets/js/charts.js';document.querySelector('#chart').innerHTML=chartPanel('offline-delivery','Delivery Activity','CDN unavailable test',false);initializeCharts();document.querySelector('#result').textContent=JSON.stringify({fallbackVisible:!document.querySelector('#offline-delivery-fallback').hidden,bars:document.querySelectorAll('.fallback-bar').length,values:[...document.querySelectorAll('.fallback-bar b')].map(e=>e.textContent)});</script></body></html>
